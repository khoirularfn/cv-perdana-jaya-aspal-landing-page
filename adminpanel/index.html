<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../cms/admin.css?v=20260607-login">
</head>
<body class="auth-locked">
<main id="loginScreen" class="login-screen" aria-labelledby="loginTitle">
  <section class="login-card">
    <div class="login-brand">
      <span class="login-logo"><img src="../assets/inovtek-studio-logo.jpeg" alt="Inovtek Studio"></span>
      <span>Admin Panel<small>by Inovtek Studio</small></span>
    </div>
    <div class="login-copy">
      <h1 id="loginTitle">Masuk Admin</h1>
    </div>
    <form id="loginForm" class="login-form" autocomplete="off" data-lpignore="true" data-1p-ignore="true">
      <label>
        <span>Username</span>
        <input id="loginUser" name="cms_access_user" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" value="" required>
      </label>
      <label>
        <span>Password</span>
        <div class="pass-field">
          <input id="loginPass" name="cms_access_key" type="password" autocomplete="new-password" value="" required>
          <button id="togglePass" type="button" aria-label="Lihat password"></button>
        </div>
      </label>
      <p id="loginError" class="login-error" aria-live="polite"></p>
      <button class="login-submit" type="submit"><span>Masuk</span></button>
    </form>
  </section>
</main>

<div id="adminShell" class="admin-shell" aria-hidden="true">
<header class="topbar">
  <div class="logo">
    <span class="dot">
      <img src="../assets/inovtek-studio-logo.jpeg" alt="Inovtek Studio">
    </span>
    <span class="hide-sm">Admin Panel<small>by Inovtek Studio</small></span>
  </div>
  <span id="saved" class="saved" aria-live="polite"></span>
  <div class="spacer"></div>
  <div class="seg hide-sm">
    <button class="active" data-dev="desktop">Desktop</button>
    <button data-dev="tablet">Tablet</button>
    <button data-dev="phone">HP</button>
  </div>
  <button id="btnAddSec" class="tbtn">Section</button>
  <button id="btnSettings" class="tbtn">Pengaturan</button>
  <button id="btnTheme" class="tbtn">Tema</button>
  <button id="btnImport" class="tbtn ghost hide-sm">Import</button>
  <input id="importFile" type="file" accept="application/json,.json" style="display:none">
  <button id="btnReset" class="tbtn ghost hide-sm">Reset</button>
  <button id="btnExport" class="tbtn ghost">Export</button>
  <button id="btnSite" class="tbtn ghost hide-sm">Situs</button>
  <button id="btnLogout" class="tbtn ghost">Keluar</button>
  <button id="btnPublish" class="tbtn primary">Publish</button>
</header>

<div class="hintbar">Edit teks langsung · ganti gambar · atur section dari toolbar.</div>

<div id="stage" class="stage">
  <div class="frame-wrap">
    <iframe id="previewFrame" src="../index.html?v=20260607-login" title="Editor"></iframe>
  </div>
</div>

<aside id="themeDrawer" class="drawer">
  <div class="dh"><h3>Tema</h3><button id="themeClose" class="tbtn ghost">Tutup</button></div>
  <div id="themeBody" class="dbody"></div>
</aside>

<aside id="setDrawer" class="drawer">
  <div class="dh"><h3>Pengaturan</h3><button id="setClose" class="tbtn ghost">Tutup</button></div>
  <div id="setBody" class="dbody"></div>
</aside>
<div id="backdrop" class="backdrop"></div>

<div id="imgModal" class="modal">
  <div class="modal-box">
    <div class="mh"><h3>Pilih / Upload Gambar</h3><button id="imgClose" class="tbtn ghost">Tutup</button></div>
    <div class="modal-body"><div id="imgGrid" class="imggrid"></div></div>
  </div>
</div>

<div id="iconModal" class="modal">
  <div class="modal-box" style="width:min(520px,96vw)">
    <div class="mh"><h3>Pilih Ikon</h3><button id="iconClose" class="tbtn ghost">Tutup</button></div>
    <div class="modal-body"><div id="iconGrid" class="icongrid"></div></div>
  </div>
</div>

<div id="addModal" class="modal">
  <div class="modal-box" style="width:min(640px,96vw)">
    <div class="mh"><h3>Tambah Section</h3><button id="addClose" class="tbtn ghost">Tutup</button></div>
    <div class="modal-body"><div id="addGrid" class="seclist"></div></div>
  </div>
</div>

<div id="toast" class="toast"></div>
</div>

<script src="../cms/cms.js?v=20260607-login"></script>
<script src="../site/icons.js?v=20260607-login"></script>
<script src="../site/content.js?v=20260607-login"></script>
<script src="../site/images.js?v=20260607-login"></script>
<script src="../site/sections.js?v=20260607-login"></script>
<script src="../site/config.js?v=20260607-login"></script>
<script src="../cms/admin.js?v=20260607-login"></script>
</body>
</html>
